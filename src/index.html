<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cache dropper</title>
  <script src="/consent.js"></script>
</head>
<body>
  <h1>Cache dropper</h1>
  <p>Pass the cache file URL via <code>?f=</code> (raw or base64). On load, consent.js fetches and strict-validates the body. Cache sizes are <strong>hardcoded</strong> in consent.js (from <code>get-cache-size.cmd</code>).</p>
  <p>
    <a href="?f=http://localhost:8080/hello.txt">?f= raw URL</a> ·
    <a href="?f=aHR0cDovL2xvY2FsaG9zdDo4MDgwL2hlbGxvLnR4dA==">?f= base64 URL</a>
  </p>
  <p>Optional debug: <span id="status">loading…</span></p>
  <pre id="preview"></pre>
</body>
</html>
